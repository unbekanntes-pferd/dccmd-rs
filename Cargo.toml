[package]
name = "dccmd-rs"
version = "1.2.0"
edition = "2021"
description = "A command line client for DRACOON"
authors = ["Octavio Simone"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "dccmd-rs"
path = "src/main.rs"

[dependencies]
# DRACOON API
dco3 = "0.18"

# CLI helpers
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
console = "0.16"
dialoguer = "0.12"
tabled = "0.20"

# async runtime and utils
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-recursion = "1"
async-trait = "0.1"

# logging and tracing
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}

# utils
chrono = "0.4"
thiserror = "2"
serde = {version = "1", features = ["derive"]}
csv = "1"
dashmap = "6"
dirs = "6"
unicode-normalization = "0.1"

# credentials
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"]}

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/dccmd-rs", dest = "/usr/bin/dccmd-rs", mode = "755" },
]
